<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ANPR Edge Camera</title>
<style>
    :root { --bg:#0a0f1c; --panel:#111a2c; --line:#223049; --text:#f1f5f9; --dim:#94a3b8; --accent:#facc15; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,'Segoe UI',sans-serif; }
    .wrap { max-width:560px; margin:0 auto; }
    header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
    .badge { width:30px;height:30px;border-radius:8px;background:var(--accent);color:#0a0f1c;
             display:grid;place-items:center;font-weight:900;font-size:12px; }
    .node { margin-left:auto; font-size:11px; color:var(--dim); }
    #camWrap { position:relative; background:#000; aspect-ratio:4/3; overflow:hidden; }
    video { width:100%; height:100%; object-fit:cover; display:block; }
    .guide { position:absolute; left:10%; right:10%; top:32%; bottom:32%;
             border:2px dashed var(--accent); border-radius:8px; pointer-events:none; }
    .guide span { position:absolute; top:-20px; left:0; font-size:10px; letter-spacing:1.2px;
                  color:var(--accent); background:rgba(10,15,28,.75); padding:2px 6px; font-weight:700; }
    .controls { display:flex; gap:10px; padding:12px 16px; align-items:center; border-bottom:1px solid var(--line); }
    button { font-family:inherit; cursor:pointer; border:none; border-radius:10px; }
    .primary { flex:1; background:var(--accent); color:#0a0f1c; font-weight:800; font-size:15px; padding:14px; }
    .primary:disabled { opacity:.6; }
    .ghost { background:transparent; border:1px solid var(--line); color:var(--text); padding:10px 14px; font-size:13px; }
    .auto { display:flex; flex-direction:column; align-items:center; font-size:10px; color:var(--dim); gap:3px; }
    main { padding:16px; }
    .card { border-radius:14px; border:2px solid; padding:16px; margin-bottom:14px; }
    .status { font-size:11px; font-weight:900; letter-spacing:1.3px; }
    .plate { font-size:30px; font-weight:800; letter-spacing:1.5px; margin:4px 0 8px; }
    .row { display:flex; font-size:12.5px; margin-top:3px; }
    .row b { width:82px; font-weight:400; opacity:.65; }
    .fines { margin-top:12px; background:rgba(0,0,0,.25); border-radius:8px; padding:10px; }
    .fines h4 { margin:0 0 4px; font-size:13px; color:#fde68a; }
    .fines div { font-size:11.5px; line-height:1.5; }
    .alertbar { margin-top:12px; background:#ef4444; color:#fff; border-radius:8px;
                padding:9px; text-align:center; font-weight:900; font-size:12px; letter-spacing:.6px; }
    .meta { font-size:10.5px; opacity:.45; margin-top:12px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:14px; }
    label { display:block; font-size:12px; color:var(--dim); margin-bottom:6px; }
    input { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px;
            padding:11px 12px; color:var(--text); font-size:15px; font-family:inherit; }
    .inline { display:flex; gap:8px; }
    .err { background:rgba(239,68,68,.12); border:1px solid #7f1d1d; color:#fca5a5;
           border-radius:10px; padding:12px; font-size:12.5px; margin-bottom:12px; white-space:pre-line; }
    .hist { border-top:1px solid rgba(34,48,73,.6); padding:6px 0; display:flex; align-items:center; font-size:12px; }
    .hist b { flex:1; font-weight:700; }
    .hist em { font-style:normal; font-size:10px; font-weight:800; margin-right:10px; }
    .hist span { color:#64748b; font-size:10.5px; }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <div class="badge">AI</div>
        <div>
            <div style="font-weight:700;font-size:14px;">ANPR Edge Camera</div>
            <div style="font-size:11px;color:var(--dim);">Browser scanner</div>
        </div>
        <div class="node" id="nodeLabel"></div>
    </header>

    <div id="camWrap">
        <video id="video" playsinline muted></video>
        <div class="guide"><span>ALIGN PLATE HERE</span></div>
    </div>

    <div class="controls">
        <button class="primary" id="scanBtn">Capture &amp; Scan</button>
        <label class="auto">Auto 2s<input type="checkbox" id="autoBox" /></label>
        <button class="ghost" id="flipBtn">Flip</button>
    </div>

    <main>
        <div id="error"></div>
        <div id="result"></div>

        <div class="panel">
            <label>Or enter a plate manually</label>
            <div class="inline">
                <input id="manual" placeholder="KL07B1234" autocapitalize="characters" autocomplete="off" />
                <button class="ghost" id="manualBtn">Scan</button>
            </div>
        </div>

        <div class="panel">
            <label>Camera node ID</label>
            <input id="nodeId" autocapitalize="characters" autocomplete="off" />
        </div>

        <div class="panel" id="histPanel" style="display:none;">
            <label>Recent scans from this device</label>
            <div id="history"></div>
        </div>
    </main>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
const PALETTE = {
    WANTED_CRIMINAL: { bg:'#7f1d1d', border:'#ef4444', text:'#fecaca', label:'WANTED — CRIMINAL' },
    SURVEILLANCE:    { bg:'#78350f', border:'#f59e0b', text:'#fde68a', label:'UNDER SURVEILLANCE' },
    NORMAL:          { bg:'#14532d', border:'#22c55e', text:'#bbf7d0', label:'NORMAL' },
    UNREGISTERED:    { bg:'#1e293b', border:'#64748b', text:'#cbd5e1', label:'NOT IN REGISTRY' },
    NO_PLATE:        { bg:'#1e293b', border:'#475569', text:'#94a3b8', label:'NO PLATE DETECTED' },
};

const $ = (id) => document.getElementById(id);
const video = $('video'), canvas = $('canvas');
let stream = null, facing = 'environment', busy = false, autoTimer = null;
const history = [];

const nodeId = localStorage.getItem('anpr.nodeId')
    || 'WEB-' + Math.random().toString(36).slice(2, 6).toUpperCase();
$('nodeId').value = nodeId;
$('nodeLabel').textContent = nodeId;
$('nodeId').addEventListener('change', (e) => {
    const v = e.target.value.trim().toUpperCase() || nodeId;
    localStorage.setItem('anpr.nodeId', v);
    $('nodeLabel').textContent = v;
});
localStorage.setItem('anpr.nodeId', nodeId);

async function startCamera() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false,
        });
        video.srcObject = stream;
        await video.play();
    } catch (err) {
        showError(
            'Camera unavailable: ' + err.message +
            '\n\nBrowsers only allow the camera on a secure origin. Open this page over https:// (accept the certificate warning once), not http://.'
        );
    }
}

function showError(msg) { $('error').innerHTML = msg ? '<div class="err">' + msg + '</div>' : ''; }

// Crops to the guide box and upscales — background scenery never reaches OCR.
function captureFrame() {
    if (!video.videoWidth) return null;
    const gw = video.videoWidth * 0.8, gh = video.videoHeight * 0.36;
    const sx = (video.videoWidth - gw) / 2, sy = (video.videoHeight - gh) / 2;
    canvas.width = gw * 1.5; canvas.height = gh * 1.5;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, sx, sy, gw, gh, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.85);
}

async function scan(manualPlate) {
    if (busy) return;
    busy = true;
    $('scanBtn').disabled = true;
    $('scanBtn').textContent = 'Scanning…';
    showError('');

    try {
        const body = { camera_node_id: $('nodeId').value.trim().toUpperCase() || nodeId };
        if (manualPlate) body.plate_number = manualPlate;
        else {
            const frame = captureFrame();
            if (!frame) throw new Error('Camera not ready');
            body.image = frame;
        }

        const res = await fetch('/api/detect', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        render(data);
        if (data.status === 'WANTED_CRIMINAL' && navigator.vibrate) navigator.vibrate([400, 150, 400]);
    } catch (err) {
        showError(err.message);
    } finally {
        busy = false;
        $('scanBtn').disabled = false;
        $('scanBtn').textContent = 'Capture & Scan';
    }
}

function render(d) {
    const p = PALETTE[d.status] || PALETTE.UNREGISTERED;
    const v = d.vehicle || {};
    let html = '<div class="card" style="background:' + p.bg + ';border-color:' + p.border + '">'
        + '<div class="status" style="color:' + p.text + '">' + p.label + '</div>'
        + '<div class="plate">' + (d.plate_number || '— no plate found —') + '</div>';

    if (d.plate_found === false) html += '<div style="font-size:13px;opacity:.85">' + d.message + '</div>';

    if (d.matched && v.owner_name) {
        html += '<div class="row"><b>Owner</b>' + v.owner_name + '</div>'
             +  '<div class="row"><b>Vehicle</b>' + v.vehicle_model + (v.vehicle_color ? ' · ' + v.vehicle_color : '') + '</div>'
             +  '<div class="row"><b>Registered</b>' + v.registration_date + '</div>';
        if (v.owner_phone) html += '<div class="row"><b>Phone</b>' + v.owner_phone + '</div>';
        if (v.status_reason) html += '<div class="row"><b>Reason</b>' + v.status_reason + '</div>';
    }

    if (d.fines && d.fines.total_unpaid > 0) {
        html += '<div class="fines"><h4>' + d.fines.total_unpaid + ' unpaid fine'
             + (d.fines.total_unpaid > 1 ? 's' : '') + ' · ₹' + d.fines.amount_due.toLocaleString('en-IN') + '</h4>';
        d.fines.items.filter((f) => f.paid_status === 'UNPAID').slice(0, 4).forEach((f) => {
            html += '<div>• ' + f.violation_type + ' — ₹' + f.amount + ' (' + f.date_issued + ')</div>';
        });
        html += '</div>';
    }

    if (d.alert) html += '<div class="alertbar">⚠ ALERT DISPATCHED TO CONTROL ROOM</div>';

    if (d.suggestions && d.suggestions.length) {
        html += '<div style="margin-top:10px;font-size:12.5px;opacity:.8">Closest registered plates:</div>';
        d.suggestions.forEach((s) => {
            html += '<div style="margin-top:5px"><a href="#" data-plate="' + s.plate
                 + '" style="color:#93c5fd">' + s.plate + ' — ' + s.owner_name + ' (' + s.status + ')</a></div>';
        });
    }

    html += '<div class="meta">' + (d.vision_source || '') + ' · '
         + Math.round((d.confidence || 0) * 100) + '% confidence'
         + (d.elapsed_ms ? ' · ' + d.elapsed_ms + 'ms' : '') + '</div></div>';

    $('result').innerHTML = html;
    $('result').querySelectorAll('a[data-plate]').forEach((a) =>
        a.addEventListener('click', (e) => { e.preventDefault(); scan(a.dataset.plate); }));

    if (d.plate_number) {
        history.unshift({ plate: d.plate_number, status: d.status, at: new Date() });
        history.length = Math.min(history.length, 25);
        $('histPanel').style.display = 'block';
        $('history').innerHTML = history.map((h) =>
            '<div class="hist"><b>' + h.plate + '</b><em style="color:'
            + (PALETTE[h.status] || PALETTE.UNREGISTERED).border + '">' + h.status + '</em><span>'
            + h.at.toLocaleTimeString() + '</span></div>').join('');
    }
}

$('scanBtn').addEventListener('click', () => scan());
$('manualBtn').addEventListener('click', () => {
    const p = $('manual').value.trim().toUpperCase();
    if (p) scan(p);
});
$('manual').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('manualBtn').click(); });
$('flipBtn').addEventListener('click', () => {
    facing = facing === 'environment' ? 'user' : 'environment';
    startCamera();
});
$('autoBox').addEventListener('change', (e) => {
    clearInterval(autoTimer);
    if (e.target.checked) autoTimer = setInterval(() => scan(), 2000);
});

startCamera();
</script>
</body>
</html>
